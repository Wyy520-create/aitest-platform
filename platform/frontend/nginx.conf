# 前端网关配置：静态资源 + API 反代（同源，无跨域）
server {
    listen 80;

    # 平台页面（Vue3 CDN 版单文件 + 本地化依赖）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 反代到后端容器（compose 服务名即主机名，这是 Docker 网络的 DNS）
    location /api/ {
        proxy_pass http://backend:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 平台触发执行是"秒回 + 后台线程跑"，长轮询/慢接口兜底
        proxy_read_timeout 120s;
    }
}
